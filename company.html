<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مساحة العمل | Smart Company</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: #f1f5f9;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            flex-shrink: 0;
            background: #111827;
            border-left: 1px solid #263244;
            padding: 22px 14px;
        }

    

.sidebar .brand {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    font-weight: bold;
    color: #60a5fa;
    text-align: center;
    width: max-content;
    padding: 0;
    margin: 0;
    z-index: 1000;
}





        .company-label {
            color: #94a3b8;
            font-size: 12px;
            margin: 0 10px 12px;
        }

        .nav-button {
            width: 100%;
            padding: 13px 12px;
            margin-bottom: 5px;
            border: 1px solid transparent;
            border-radius: 9px;
            background: transparent;
            color: #cbd5e1;
            text-align: right;
            transition: 0.2s;
        }

        .nav-button:hover,
        .nav-button.active {
            background: #1e3a5f;
            border-color: #294d78;
            color: #ffffff;
        }

        .main {
            flex: 1;
            min-width: 0;
        }

        .topbar {
            min-height: 75px;
            padding: 18px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid #263244;
            background: #0f172a;
        }

        .topbar h1 {
            font-size: 20px;
            margin: 0;
        }

        .back-button {
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
        }

        .content {
            padding: 28px;
            max-width: 1200px;
            margin: auto;
        }

        .welcome {
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #263f61;
            background: linear-gradient(135deg, #172554, #111827);
            margin-bottom: 24px;
        }

        .welcome h2 {
            font-size: 28px;
            margin: 0 0 12px;
        }

        .welcome p {
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 0;
        }

        .section-title {
            margin: 30px 0 16px;
            font-size: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .module-card {
            padding: 22px;
            border: 1px solid #263244;
            background: #111827;
            border-radius: 13px;
            text-align: right;
            color: #f1f5f9;
            transition: 0.2s;
        }

        .module-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        /* QA Center tile: same module-card layout, with a subtle quality-tool accent. */
        .qa-center-module-card {
            position: relative;
            overflow: hidden;
            border-color: #334b78;
            background: linear-gradient(135deg, #17264a 0%, #111827 72%);
        }

        .qa-center-module-card::after {
            content: "QA";
            position: absolute;
            left: 14px;
            top: 12px;
            padding: 4px 8px;
            border: 1px solid #45659b;
            border-radius: 7px;
            color: #93c5fd;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .qa-center-module-card:hover {
            border-color: #60a5fa;
            background: linear-gradient(135deg, #1e3260 0%, #111827 78%);
        }

        .module-icon {
            display: block;
            font-size: 27px;
            margin-bottom: 13px;
        }

        .module-card h3 {
            margin: 0 0 10px;
            font-size: 17px;
        }

        .module-card p {
            margin: 0;
            color: #94a3b8;
            line-height: 1.7;
            font-size: 14px;
        }

        .status {
            margin-top: 22px;
            color: #94a3b8;
            line-height: 1.8;
        }

        .message {
            padding: 16px;
            border-radius: 10px;
            background: #172033;
            border: 1px solid #334155;
            line-height: 1.8;
        }

        .error {
            border-color: #7f1d1d;
            color: #fecaca;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 650px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-left: none;
                border-bottom: 1px solid #263244;
                padding: 12px;
            }

          

            .navigation {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 5px;
            }

            .nav-button {
                margin: 0;
                font-size: 13px;
            }

            .topbar {
                padding: 16px;
            }

            .topbar h1 {
                font-size: 17px;
            }

            .content {
                padding: 16px;
            }

            .welcome {
                padding: 22px;
            }

            .welcome h2 {
                font-size: 23px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

 
/* ================================
   Smart Company - Projects UI
================================ */

.project-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 650px;
    margin: 24px 0;
    padding: 22px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 18px;
    box-sizing: border-box;
}

.project-form input,
.project-form textarea {
    width: 100%;
    min-height: 48px;
    padding: 13px 15px;
    border: 1px solid #303b4f;
    border-radius: 11px;
    outline: none;
    background: #111827;
    color: #f1f5f9;
    font: inherit;
    font-size: 15px;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.project-form textarea {
    min-height: 110px;
    resize: vertical;
    line-height: 1.7;
}

.project-form input::placeholder,
.project-form textarea::placeholder {
    color: #94a3b8;
}

.project-form input:focus,
.project-form textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.project-form button {
    min-height: 48px;
    padding: 12px 20px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, filter 0.2s, opacity 0.2s;
}

.project-form button:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
}

.project-form button:active {
    transform: translateY(0);
}

.project-form button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.project-form [role="status"] {
    margin: 0;
    color: #93c5fd;
    font-size: 14px;
    line-height: 1.7;
}

.project-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
    gap: 16px;
    width: 100%;
    margin: 20px 0;
}

.project-card {
    min-width: 0;
    padding: 20px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(148, 163, 184, 0.17);
    border-radius: 16px;
    box-sizing: border-box;
    overflow-wrap: anywhere;
    transition: border-color 0.2s, transform 0.2s;
}

.project-card:hover {
    border-color: rgba(59, 130, 246, 0.6);
    transform: translateY(-2px);
}

.project-card h3 {
    margin: 0 0 12px;
    color: #e2e8f0;
    font-size: 17px;
}

.project-card p {
    color: #cbd5e1;
    font-size: 14px;
    line-height: 1.8;
}

@media (max-width: 600px) {
    .project-form {
        padding: 16px;
        border-radius: 14px;
    }

    .project-list {
        grid-template-columns: 1fr;
    }

    .project-form button {
        width: 100%;
    }
}

.project-tasks-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: 46px;
    margin-top: 12px;
    padding: 12px 18px;
    border: 1px solid rgba(59, 130, 246, 0.35);
    border-radius: 11px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, filter 0.2s;
}

.project-tasks-button:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
}

.project-tasks-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.project-form select,
.project-card select {
    width: 100%;
    min-height: 46px;
    padding: 12px;
    border: 1px solid #303b4f;
    border-radius: 11px;
    background: #111827;
    color: #f1f5f9;
    font: inherit;
    box-sizing: border-box;
}

/* إحصائيات المشروع */
.project-stats {
    margin: 16px 0;
    padding: 14px;
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 12px;
    background: rgba(15, 23, 42, 0.65);
    color: #e2e8f0;
    line-height: 1.8;
}

.project-stats p {
    margin: 6px 0;
}

.project-stats progress {
    display: block;
    width: 100%;
    height: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 10px;
    overflow: hidden;
    accent-color: #38bdf8;
}
/* تصميم زر تحديث حالة المهمة */
button.project-tasks-button {
display: inline-flex;
align-items: center;
justify-content: center;


padding: 12px 22px;
margin-top: 12px;

background: linear-gradient(135deg, #2563eb, #0284c7);
color: #ffffff;

font-family: inherit;
font-size: 14px;
font-weight: 700;

border: none;
border-radius: 10px;

cursor: pointer;
box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);

transition: all 0.2s ease;


}

button.project-tasks-button:hover:not(:disabled) {
background: linear-gradient(135deg, #3b82f6, #0ea5e9);
transform: translateY(-2px);
box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
}

button.project-tasks-button:active:not(:disabled) {
transform: scale(0.97);
}

button.project-tasks-button:disabled {
opacity: 0.6;
cursor: not-allowed;
box-shadow: none;
}

button.project-tasks-button:focus-visible {
outline: 2px solid #38bdf8;
outline-offset: 3px;
}

@media (max-width: 600px) {
button.project-tasks-button {
width: 100%;
min-height: 46px;
}
}

/* =========================================
   محادثات صالة المكتب
   ========================================= */

.office-chat-overlay {
    z-index: 10000;
}

.office-chat-dialog {
    width: min(680px, 94vw);
    max-width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow: hidden;
    box-sizing: border-box;
}

.office-chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}

.office-chat-header h3 {
    margin: 0;
    overflow-wrap: anywhere;
}

.office-chat-messages {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 220px;
    max-height: 48vh;
    overflow-y: auto;
    padding: 12px;
    border: 1px solid #d8dee8;
    border-radius: 12px;
    background: #f7f9fc;
    box-sizing: border-box;
}

.office-chat-message {
    max-width: 85%;
    padding: 10px 12px;
    border-radius: 12px;
    overflow-wrap: anywhere;
    box-sizing: border-box;
}

.office-chat-message-mine {
    align-self: flex-end;
    background: #dbeafe;
    color: #172554;
}

.office-chat-message-other {
    align-self: flex-start;
    background: #ffffff;
    color: #1f2937;
    border: 1px solid #e5e7eb;
}

.office-chat-message strong {
    display: block;
    margin-bottom: 5px;
    font-size: 0.85rem;
}

.office-chat-message p {
    margin: 0 0 6px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.office-chat-message time {
    display: block;
    font-size: 0.75rem;
    opacity: 0.75;
}

.office-chat-form {
    display: flex;
    align-items: flex-end;
    gap: 10px;
}

.office-chat-input {
    flex: 1;
    min-width: 0;
    resize: vertical;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font: inherit;
    box-sizing: border-box;
}

.office-chat-form button {
    flex-shrink: 0;
}

.office-chat-form button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

@media (max-width: 480px) {
    .office-chat-dialog {
        width: 96vw;
        padding: 12px;
    }

    .office-chat-messages {
        min-height: 180px;
        max-height: 45vh;
    }

    .office-chat-message {
        max-width: 94%;
    }

    .office-chat-form {
        align-items: stretch;
    }
}

/* ===== Smart Company: واجهة الغرفة ===== */

.office-interior {
    direction: rtl;
    width: 100%;
    min-height: 480px;
    padding: 24px;
    box-sizing: border-box;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 22px;
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(0, 102, 255, 0.16),
            transparent 38%
        ),
        linear-gradient(145deg, #111827, #080d18);
    color: #f8fafc;
}

.office-interior-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 28px;
}

.office-eyebrow {
    display: block;
    margin-bottom: 9px;
    color: #60a5fa;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    direction: ltr;
    text-align: right;
}

.office-interior-title {
    margin: 0;
    font-size: clamp(23px, 4vw, 32px);
    font-weight: 800;
}

.office-interior-header p {
    margin: 10px 0 0;
    color: #aab8cc;
    line-height: 1.8;
}

.office-back-lobby {
    padding: 12px 17px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 12px;
    background: rgba(30, 41, 59, 0.8);
    color: #f8fafc;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s ease;
}

.office-back-lobby:hover {
    background: #1d4ed8;
    border-color: #3b82f6;
    transform: translateY(-2px);
}

/* مساحة الغرفة */

.office-room-scene {
    position: relative;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
    align-items: stretch;
    padding: 70px 24px 30px;
    min-height: 260px;
    border: 1px solid rgba(96, 165, 250, 0.17);
    border-radius: 20px;
    background:
        linear-gradient(
            180deg,
            rgba(30, 58, 95, 0.45),
            rgba(9, 15, 27, 0.8)
        );
    overflow: hidden;
}

.office-room-scene::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(
            rgba(148, 163, 184, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(148, 163, 184, 0.035) 1px,
            transparent 1px
        );
    background-size: 28px 28px;
}

.office-scene-label {
    position: absolute;
    top: 20px;
    right: 22px;
    color: #94a3b8;
    font-size: 12px;
    z-index: 1;
}

/* الخزانة والمحادثة */

.office-room-locker,
.office-room-chat-card {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 220px;
    padding: 24px 16px;
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 18px;
    background: rgba(15, 23, 42, 0.9);
    color: #f8fafc;
    font: inherit;
    text-align: center;
    cursor: pointer;
    transition:
        transform 0.22s ease,
        border-color 0.22s ease,
        background 0.22s ease,
        box-shadow 0.22s ease;
}

.office-room-locker:hover,
.office-room-chat-card:hover {
    transform: translateY(-5px);
    border-color: #3b82f6;
    background: rgba(30, 58, 95, 0.7);
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
}

.office-room-locker-icon,
.office-room-chat-icon {
    display: grid;
    place-items: center;
    width: 88px;
    height: 88px;
    border-radius: 22px;
    background: rgba(37, 99, 235, 0.12);
    border: 1px solid rgba(96, 165, 250, 0.18);
    font-size: 48px;
}

.office-room-locker strong,
.office-room-chat-card strong {
    font-size: 18px;
}

.office-room-locker > span:not(.office-room-locker-icon),
.office-room-chat-card > span:not(.office-room-chat-icon) {
    color: #aab8cc;
    font-size: 13px;
    line-height: 1.7;
}

.office-room-action {
    margin-top: 5px;
    color: #60a5fa !important;
    font-weight: 700;
}

/* معلومات الغرفة */

.office-room-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 20px;
    padding: 16px 18px;
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 13px;
    background: rgba(15, 23, 42, 0.5);
    color: #94a3b8;
    font-size: 12px;
}

/* واجهة الخزانة */

.office-locker-storage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 330px;
    padding: 28px;
    box-sizing: border-box;
    border: 1px solid rgba(96, 165, 250, 0.17);
    border-radius: 20px;
    background: rgba(15, 23, 42, 0.65);
    text-align: center;
}

.office-locker-large-icon {
    display: grid;
    place-items: center;
    width: 120px;
    height: 120px;
    margin-bottom: 22px;
    border: 1px solid rgba(96, 165, 250, 0.25);
    border-radius: 28px;
    background: rgba(37, 99, 235, 0.12);
    font-size: 68px;
}

.office-locker-storage h3 {
    margin: 0 0 12px;
    font-size: 22px;
}

.office-locker-storage p {
    max-width: 500px;
    color: #aab8cc;
    line-height: 1.9;
}

.office-locker-status {
    margin-top: 16px;
    padding: 13px 17px;
    border: 1px solid rgba(96, 165, 250, 0.18);
    border-radius: 12px;
    background: rgba(30, 58, 95, 0.35);
    color: #bfdbfe;
    font-size: 13px;
    line-height: 1.8;
}

/* دعم شاشات الهاتف */

@media (max-width: 600px) {
    .office-interior {
        padding: 15px;
        border-radius: 16px;
    }

    .office-interior-header {
        align-items: stretch;
    }

    .office-back-lobby {
        width: 100%;
    }

    .office-room-scene {
        grid-template-columns: 1fr;
        padding: 60px 13px 18px;
        gap: 14px;
    }

    .office-room-locker,
    .office-room-chat-card {
        min-height: 190px;
    }

    .office-room-footer {
        align-items: flex-start;
        flex-direction: column;
    }

    .office-locker-storage {
        padding: 20px 14px;
    }
}

/* ===== Smart Company Locker ===== */

.office-locker-upload {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px;
    margin-bottom: 26px;
    border: 1px solid rgba(96, 165, 250, 0.2);
    border-radius: 20px;
    background: rgba(15, 23, 42, 0.65);
    text-align: center;
}

.office-locker-upload h3 {
    margin: 0 0 8px;
    font-size: 22px;
}

.office-locker-upload p {
    color: #aab8cc;
    line-height: 1.8;
}

.office-locker-file-input {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
}

.office-locker-upload-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 24px;
    margin-top: 10px;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
}

.office-locker-upload-button:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
}

.office-locker-upload-button.is-disabled {
    opacity: 0.6;
    pointer-events: none;
}

.office-locker-files-section {
    padding: 20px;
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 18px;
    background: rgba(15, 23, 42, 0.45);
}

.office-locker-files-header {
    display: flex;
    align-items: center;

/* =========================================
   Smart Company - Modern Voice Message Player
========================================= */

.whatsapp-voice {
    direction: ltr;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 330px;
    min-width: 0;
    margin-top: 8px;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #dce9ff;
    border-radius: 18px;
    background: linear-gradient(135deg, #f8fbff, #edf4ff);
    box-shadow: 0 3px 12px rgba(0, 102, 255, 0.06);
    transition: background 0.2s ease, box-shadow 0.2s ease;
}

.whatsapp-voice.is-playing {
    background: linear-gradient(135deg, #eff6ff, #e4efff);
    box-shadow: 0 4px 16px rgba(0, 102, 255, 0.12);
}

/* زر التشغيل */

.whatsapp-voice-play {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg, #1683ff, #0066ff);
    color: #fff;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 102, 255, 0.22);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.whatsapp-voice-play:hover {
    transform: scale(1.06);
    box-shadow: 0 5px 14px rgba(0, 102, 255, 0.3);
}

.whatsapp-voice-play:active {
    transform: scale(0.95);
}

.whatsapp-voice-play:focus-visible {
    outline: 3px solid #91c3ff;
    outline-offset: 3px;
}

/* محتوى المشغل */

.whatsapp-voice-content {
    flex: 1;
    min-width: 0;
}

/* مساحة الموجات */

.whatsapp-wave-wrapper {
    width: 100%;
    padding: 4px 0;
}

.whatsapp-voice-wave {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 3px;
    width: 100%;
    height: 40px;
    overflow: hidden;
    cursor: pointer;
    border-radius: 6px;
    touch-action: manipulation;
}

.whatsapp-wave-bar {
    flex: 1 1 0;
    min-width: 2px;
    max-width: 5px;
    border-radius: 5px;
    background: #b5c9e9;
    transition: background 0.15s ease;
}

.whatsapp-wave-bar.is-played {
    background: #087cff;
}

.whatsapp-voice.is-playing .whatsapp-wave-bar.is-played {
    background: #0059db;
}

/* الوقت الحالي ومدة التسجيل */

.whatsapp-time-row {
    direction: ltr;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 5px;
    color: #60748f;
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
}

.whatsapp-current-time {
    color: #087cff;
}

.whatsapp-voice audio {
    display: none;
}

/* الوضع الداكن، إذا كانت واجهة التطبيق تستخدمه */

@media (prefers-color-scheme: dark) {
    .whatsapp-voice {
        border-color: #263d5d;
        background: linear-gradient(135deg, #15243a, #101c30);
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    .whatsapp-voice.is-playing {
        background: linear-gradient(135deg, #192d49, #122540);
    }

    .whatsapp-wave-bar {
        background: #415775;
    }

    .whatsapp-wave-bar.is-played {
        background: #48a0ff;
    }

    .whatsapp-time-row {
        color: #a6bad5;
    }

    .whatsapp-current-time {
        color: #65b0ff;
    }
}

/* الشاشات الصغيرة */

@media (max-width: 480px) {
    .whatsapp-voice {
        max-width: 100%;
        gap: 10px;
        padding: 10px;
    }

    .whatsapp-voice-play {
        flex-basis: 40px;
        width: 40px;
        height: 40px;
    }

    .whatsapp-voice-wave {
        gap: 2px;
    }
}

/* أزرار الرجوع والتفاصيل */

.tasks-status-select:hover {

/* الرسائل والقوائم الفارغة */

/* =========================================
SMART COMPANY - FILES SECTION
========================================= */

.company-files-section {
width: 100%;
max-width: 1200px;
margin: 0 auto;
padding: 28px;
direction: rtl;
text-align: right;
box-sizing: border-box;
color: #e8edf8;
}

.company-files-section *,
.company-files-section *::before,
.company-files-section *::after {
box-sizing: border-box;
}

.company-files-section > h2 {
margin: 0 0 10px;
font-size: clamp(24px, 3vw, 32px);
font-weight: 800;
letter-spacing: -0.5px;
color: #ffffff;
}

.company-files-section > p {
margin: 0 0 28px;
color: #9aa9c4;
font-size: 15px;
line-height: 1.9;
}

/* Cards */

.company-files-upload-card,
.company-files-list-card {
width: 100%;
margin-bottom: 24px;
padding: 26px;
background: linear-gradient(
145deg,
rgba(22, 32, 55, 0.98),
rgba(13, 21, 39, 0.98)
);
border: 1px solid rgba(130, 157, 205, 0.15);
border-radius: 20px;
box-shadow: 0 12px 35px rgba(0, 0, 0, 0.16);
}

.company-files-upload-card h3,
.company-files-list-card h3 {
margin: 0 0 22px;
color: #f4f7ff;
font-size: 20px;
font-weight: 750;
}

/* File input */

.company-files-upload-card input[type="file"] {
display: block;
width: 100%;
min-height: 58px;
margin-bottom: 18px;
padding: 12px;
color: #cbd7ed;
background: rgba(5, 12, 27, 0.65);
border: 1px dashed #42577c;
border-radius: 12px;
cursor: pointer;
}

.company-files-upload-card input[type="file"]::file-selector-button {
margin-left: 12px;
padding: 9px 15px;
color: #ffffff;
background: #2563eb;
border: 0;
border-radius: 8px;
font-weight: 700;
cursor: pointer;
transition: background 0.2s ease;
}

.company-files-upload-card input[type="file"]::file-selector-button:hover {
background: #1d4ed8;
}

/* Name input */

.company-files-upload-card input[type="text"] {
display: block;
width: 100%;
min-height: 48px;
margin-bottom: 20px;
padding: 12px 15px;
color: #ffffff;
background: rgba(5, 12, 27, 0.65);
border: 1px solid #334564;
border-radius: 11px;
outline: none;
font: inherit;
transition:
border-color 0.2s ease,
box-shadow 0.2s ease;
}

.company-files-upload-card input[type="text"]::placeholder {
color: #7586a4;
}

.company-files-upload-card input[type="text"]:focus {
border-color: #4d8dff;
box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.14);
}

/* Visibility */

.company-files-upload-card label {
display: block;
margin-bottom: 10px;
color: #dce6f8;
font-size: 14px;
font-weight: 700;
}

.company-files-upload-card select {
display: block;
width: 100%;
min-height: 48px;
margin-bottom: 12px;
padding: 10px 14px;
color: #ffffff;
background: #111d34;
border: 1px solid #334564;
border-radius: 11px;
outline: none;
font: inherit;
cursor: pointer;
}

.company-files-upload-card select:focus {
border-color: #4d8dff;
}

.company-files-upload-card select option {
color: #ffffff;
background: #111d34;
}

/* Notice */

.company-files-upload-card small {
display: block;
margin-bottom: 20px;
color: #8fa2c2;
font-size: 12px;
line-height: 1.9;
}

/* Buttons */

.company-files-section button {
font: inherit;
cursor: pointer;
transition:
background 0.2s ease,
border-color 0.2s ease,
transform 0.2s ease,
box-shadow 0.2s ease;
}

.company-files-upload-card > button {
width: 100%;
min-height: 48px;
padding: 12px 20px;
color: #ffffff;
background: linear-gradient(135deg, #3478f6, #5b55e7);
border: 0;
border-radius: 11px;
font-weight: 800;
box-shadow: 0 6px 18px rgba(48, 103, 232, 0.2);
}

.company-files-upload-card > button:hover {
background: linear-gradient(135deg, #4788ff, #6b65f5);
box-shadow: 0 8px 24px rgba(48, 103, 232, 0.3);
transform: translateY(-1px);
}

.company-files-upload-card > button:disabled {
opacity: 0.6;
cursor: wait;
transform: none;
box-shadow: none;
}

/* Upload status */

.company-files-upload-card [role="status"] {
margin: 12px 0 0;
color: #9fc3ff;
font-size: 13px;
line-height: 1.8;
overflow-wrap: anywhere;
}

/* Tabs */

.company-files-tabs {
display: grid;
grid-template-columns: repeat(3, minmax(0, 1fr));
gap: 10px;
margin-bottom: 22px;
}

.company-files-tabs button {
min-width: 0;
min-height: 48px;
padding: 10px 12px;
color: #aebdd6;
background: rgba(5, 12, 27, 0.55);
border: 1px solid #2d3d5b;
border-radius: 11px;
font-size: 13px;
font-weight: 700;
overflow-wrap: anywhere;
}

.company-files-tabs button:hover {
color: #ffffff;
background: #1a2a48;
border-color: #496a9d;
}

.company-files-tabs button.active {
color: #ffffff;
background: linear-gradient(135deg, #2563eb, #5145cd);
border-color: transparent;
box-shadow: 0 5px 16px rgba(37, 99, 235, 0.2);
}

/* Files list */

.company-files-list {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 14px;
}

.company-file-item {
min-width: 0;
padding: 18px;
background: rgba(5, 12, 27, 0.5);
border: 1px solid rgba(130, 157, 205, 0.15);
border-radius: 14px;
transition:
border-color 0.2s ease,
background 0.2s ease,
transform 0.2s ease;
}

.company-file-item:hover {
background: rgba(25, 39, 65, 0.75);
border-color: rgba(91, 141, 255, 0.5);
transform: translateY(-2px);
}

.company-file-item strong {
display: block;
margin-bottom: 10px;
color: #f1f5ff;
font-size: 15px;
font-weight: 750;
overflow-wrap: anywhere;
line-height: 1.8;
}

.company-file-item p {
margin: 0 0 15px;
color: #8fa2c2;
font-size: 12px;
line-height: 1.9;
overflow-wrap: anywhere;
}

.company-file-item button {
width: 100%;
min-height: 40px;
padding: 9px 14px;
color: #cfe0ff;
background: rgba(37, 99, 235, 0.13);
border: 1px solid rgba(80, 135, 255, 0.35);
border-radius: 9px;
font-size: 13px;
font-weight: 750;
}

.company-file-item button:hover {
color: #ffffff;
background: #2458bf;
border-color: #477df0;
}

/* Empty/loading/error states */

.company-files-list-card > [role="status"] {
margin: 0 0 16px;
color: #9aacc9;
font-size: 13px;
line-height: 1.9;
overflow-wrap: anywhere;
}

/* Back button */

.company-files-section > .back-button {
min-height: 44px;
padding: 10px 18px;
color: #cbd7ed;
background: #18243b;
border: 1px solid #344563;
border-radius: 10px;
font-weight: 700;
}

.company-files-section > .back-button:hover {
color: #ffffff;
background: #243654;
border-color: #54719f;
}

/* Mobile */

@media (max-width: 700px) {
.company-files-section {
padding: 16px 12px;
}


.company-files-section > p {
    margin-bottom: 20px;
    font-size: 13px;
}

.company-files-upload-card,
.company-files-list-card {
    padding: 17px;
    margin-bottom: 16px;
    border-radius: 15px;
}

.company-files-upload-card h3,
.company-files-list-card h3 {
    font-size: 18px;
    margin-bottom: 17px;
}

.company-files-tabs {
    grid-template-columns: 1fr;
    gap: 8px;
}

.company-files-tabs button {
    min-height: 44px;
    font-size: 14px;
}

.company-files-list {
    grid-template-columns: 1fr;
}

.company-file-item {
    padding: 15px;
}


}

@media (prefers-reduced-motion: reduce) {
.company-files-section *,
.company-files-section *::before,
.company-files-section *::after {
transition: none !important;
transform: none !important;
}
}

@media (max-width: 600px) {
